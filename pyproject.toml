[project]
name = "python-project-template"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.11",
    "pydantic>=2.10.6",
    "python-dotenv>=1.0.1",
    "uvicorn>=0.34.0",
]

[build-system]
requires = ["uv_build>=0.8.13,<0.9.0"]
build-backend = "uv_build"

[tool.ruff]
fix = true

[tool.pyrefly]
project-includes = ["src", "tests"]
check-unannotated-defs = true
strict-callable-subtyping = true
infer-return-types = "annotated"
min-severity = "warn"

[dependency-groups]
dev = [
    "ruff",
    "pre-commit",
    "pyrefly",
    "debugpy>=1.8.13",
    "pytest>=8.3.5",
    "pytest-cov",
    "httpx>=0.28.1",
]
